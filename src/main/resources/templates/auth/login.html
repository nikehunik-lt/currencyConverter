<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased min-h-screen flex flex-col justify-center py-12 sm:px-6 lg:px-8">
<div class="sm:mx-auto sm:w-full sm:max-w-md">
    <h2 class="text-center text-3xl font-bold tracking-tight text-white">Welcome Back 👋</h2>
    <p class="mt-2 text-center text-sm text-slate-400">Log in to manage assets and metrics 🔐</p>
</div>

<div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
    <div class="bg-slate-900 py-8 px-4 shadow-xl border border-slate-800 rounded-2xl sm:px-10">
        <div th:if="${param.error}" class="mb-4 p-3 bg-rose-500/10 border border-rose-500/20 text-rose-400 text-sm rounded-xl flex items-center gap-1.5">
            ⚠️ Invalid username or password.
        </div>
        <div th:if="${param.logout}" class="mb-4 p-3 bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-sm rounded-xl flex items-center gap-1.5">
            🚪 You have been successfully logged out.
        </div>
        <div th:if="${param.registered}" class="mb-4 p-3 bg-cyan-500/10 border border-cyan-500/20 text-cyan-400 text-sm rounded-xl flex items-center gap-1.5">
            🎉 Registration complete! Please log in.
        </div>

        <form th:action="@{/login}" method="post" class="space-y-5">
            <div>
                <label for="username" class="block text-sm font-semibold text-slate-300 flex items-center gap-1">👤 Username</label>
                <div class="mt-1">
                    <input type="text" id="username" name="username" required class="w-full px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-cyan-500/30 focus:border-cyan-400 transition duration-150" />
                </div>
            </div>

            <div>
                <label for="password" class="block text-sm font-semibold text-slate-300 flex items-center gap-1">🔑 Password</label>
                <div class="mt-1">
                    <input type="password" id="password" name="password" required class="w-full px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-cyan-500/30 focus:border-cyan-400 transition duration-150" />
                </div>
            </div>

            <div class="pt-2">
                <button type="submit" class="w-full px-4 py-2.5 bg-cyan-400 text-slate-950 font-bold text-sm rounded-xl hover:bg-cyan-300 transition duration-150 shadow-md shadow-cyan-500/10 flex items-center justify-center gap-1">🚀 Authenticate</button>
            </div>
        </form>

        <div class="mt-6 pt-4 border-t border-slate-800 text-center text-sm text-slate-400">
            New to the platform? <a th:href="@{/register}" class="font-semibold text-cyan-400 hover:text-cyan-300">Create an account ✨</a>
        </div>
    </div>
</div>
</body>
</html>
