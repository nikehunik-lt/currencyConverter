<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Exchange Rates Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased">
<div class="min-h-screen flex flex-col">
    <nav class="bg-slate-900/80 backdrop-blur-md border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center space-x-8">
                    <span class="text-xl font-bold bg-gradient-to-r from-cyan-400 to-indigo-400 bg-clip-text text-transparent flex items-center gap-2">📊 FX Analytics</span>
                    <div class="hidden md:flex space-x-6">
                        <a th:href="@{/currencies}" class="border-b-2 border-transparent px-1 pt-1 text-sm font-medium text-slate-400 hover:text-slate-200 hover:border-slate-700 flex items-center gap-1.5">💵 Currencies</a>
                        <a th:href="@{/rates}" class="border-b-2 border-cyan-400 px-1 pt-1 text-sm font-semibold text-slate-100 flex items-center gap-1.5">📈 Exchange Rates</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="sm:flex sm:items-center sm:justify-between mb-8">
            <div>
                <h1 class="text-3xl font-bold text-white tracking-tight flex items-center gap-2">Exchange Rates 📈</h1>
                <p class="mt-2 text-sm text-slate-400">Track buy and sell margins across different dates 💸</p>
            </div>
            <div class="mt-4 sm:mt-0">
                <a th:href="@{/rates/add}" class="inline-flex items-center justify-center px-4 py-2.5 border border-transparent text-sm font-semibold rounded-xl text-slate-950 bg-cyan-400 hover:bg-cyan-300 shadow-lg shadow-cyan-500/20 transition duration-150 gap-1.5">
                    ✨ Add New Rate
                </a>
            </div>
        </div>

        <div class="bg-slate-900 rounded-2xl border border-slate-800 shadow-xl p-6 mb-8">
            <form th:action="@{/rates}" method="get" class="sm:flex sm:items-center space-y-3 sm:space-y-0 sm:space-x-4">
                <input type="hidden" name="sortField" th:value="${sortField}" />
                <input type="hidden" name="sortDir" th:value="${sortDir}" />
                <div class="flex items-center flex-1 space-x-3">
                    <label for="currencyId" class="text-sm font-semibold text-slate-400 whitespace-nowrap flex items-center gap-1">🎯 Filter by Currency:</label>
                    <select id="currencyId" name="currencyId" class="bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-sm text-slate-200 focus:outline-none focus:ring-2 focus:ring-cyan-500/30 focus:border-cyan-400 transition duration-150 min-w-[150px]">
                        <option value="">All Assets 🌐</option>
                        <option th:each="c : ${currencies}" th:value="${c.id}" th:text="${c.code}" th:selected="${c.id == selectedCurrencyId}"></option>
                    </select>
                </div>
                <button type="submit" class="px-5 py-2.5 bg-indigo-600 text-white font-semibold text-sm rounded-xl hover:bg-indigo-500 transition duration-150 shadow-md w-full sm:w-auto flex items-center justify-center gap-1">⚡ Filter</button>
            </form>
        </div>

        <div class="bg-slate-900 rounded-2xl border border-slate-800 shadow-xl overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                    <tr class="bg-slate-950/60 border-b border-slate-800 text-xs font-semibold text-slate-400 uppercase tracking-wider">
                        <th class="px-6 py-4">
                            <a th:href="@{/rates(currencyId=${selectedCurrencyId}, sortField='id', sortDir=${sortField == 'id' ? reverseSortDir : 'asc'})}" class="flex items-center gap-1 hover:text-cyan-400 transition-colors">
                                ID <span th:if="${sortField == 'id'}" th:text="${sortDir == 'asc' ? '⬆️' : '⬇️'}"></span>
                            </a>
                        </th>
                        <th class="px-6 py-4">
                            <a th:href="@{/rates(currencyId=${selectedCurrencyId}, sortField='date', sortDir=${sortField == 'date' ? reverseSortDir : 'asc'})}" class="flex items-center gap-1 hover:text-cyan-400 transition-colors">
                                Date <span th:if="${sortField == 'date'}" th:text="${sortDir == 'asc' ? '⬆️' : '⬇️'}"></span>
                            </a>
                        </th>
                        <th class="px-6 py-4">
                            <a th:href="@{/rates(currencyId=${selectedCurrencyId}, sortField='buyRate', sortDir=${sortField == 'buyRate' ? reverseSortDir : 'asc'})}" class="flex items-center gap-1 hover:text-cyan-400 transition-colors">
                                🟢 Buy Rate <span th:if="${sortField == 'buyRate'}" th:text="${sortDir == 'asc' ? '⬆️' : '⬇️'}"></span>
                            </a>
                        </th>
                        <th class="px-6 py-4">
                            <a th:href="@{/rates(currencyId=${selectedCurrencyId}, sortField='sellRate', sortDir=${sortField == 'sellRate' ? reverseSortDir : 'asc'})}" class="flex items-center gap-1 hover:text-cyan-400 transition-colors">
                                🔴 Sell Rate <span th:if="${sortField == 'sellRate'}" th:text="${sortDir == 'asc' ? '⬆️' : '⬇️'}"></span>
                            </a>
                        </th>
                        <th class="px-6 py-4">
                            Currency
                        </th>
                        <th class="px-6 py-4 text-right">Actions</th>
                    </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-800/60 text-sm">
                    <tr th:each="rate : ${rates}" class="hover:bg-slate-800/40 transition duration-150">
                        <td class="px-6 py-4 whitespace-nowrap">
                            <a th:href="@{/rates/{id}(id=${rate.id})}" th:text="${rate.id}" class="font-bold text-cyan-400 hover:text-cyan-300"></a>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-slate-300 font-semibold font-mono flex items-center gap-1">📅 <span th:text="${rate.date}"></span></td>
                        <td class="px-6 py-4 whitespace-nowrap text-emerald-400 font-bold font-mono text-base" th:text="${rate.buyRate}"></td>
                        <td class="px-6 py-4 whitespace-nowrap text-rose-400 font-bold font-mono text-base" th:text="${rate.sellRate}"></td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <span class="inline-flex items-center px-2.5 py-1 rounded-md text-xs font-bold bg-slate-800 text-slate-300 border border-slate-700 font-mono uppercase" th:text="${rate.currency.code}"></span>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-right space-x-2">
                            <a th:href="@{/rates/edit/{id}(id=${rate.id})}" class="inline-flex items-center px-3 py-1.5 border border-slate-700 text-xs font-semibold rounded-lg text-slate-300 bg-slate-800 hover:bg-slate-700 transition duration-150 gap-1">🛠️ Edit</a>
                            <form th:action="@{/rates/delete/{id}(id=${rate.id})}" method="post" class="inline">
                                <button type="submit" class="inline-flex items-center px-3 py-1.5 text-xs font-semibold rounded-lg text-rose-400 bg-rose-500/10 border border-rose-500/20 hover:bg-rose-500/20 transition duration-150 gap-1">🗑️ Delete</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>
</body>
</html>
