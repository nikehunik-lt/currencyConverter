<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>View Currency</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-info text-white">
                    <h3 class="mb-0">Currency Details</h3>
                </div>
                <div class="card-body">
                    <ul class="list-group list-group-flush mb-4">
                        <li class="list-group-item"><strong>ID:</strong> <span th:text="${currency.id}"></span></li>
                        <li class="list-group-item"><strong>Code:</strong> <span class="badge bg-primary fs-6" th:text="${currency.code}"></span></li>
                        <li class="list-group-item"><strong>Name:</strong> <span th:text="${currency.name}"></span></li>
                    </ul>
                    <div class="d-flex justify-content-between">
                        <a th:href="@{/currencies}" class="btn btn-secondary">Back to list</a>
                        <a th:href="@{/currencies/edit/{id}(id=${currency.id})}" class="btn btn-warning">Edit Currency</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
