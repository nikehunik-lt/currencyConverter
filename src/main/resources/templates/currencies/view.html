<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>View Currency</title>
</head>
<body>
<h1>Currency Details</h1>
<p><strong>ID:</strong> <span th:text="${currency.id}"></span></p>
<p><strong>Code:</strong> <span th:text="${currency.code}"></span></p>
<p><strong>Name:</strong> <span th:text="${currency.name}"></span></p>
<a th:href="@{/currencies}">Back to list</a>
<a th:href="@{/currencies/edit/{id}(id=${currency.id})}">Edit</a>
</body>
</html>
