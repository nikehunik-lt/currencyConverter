<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Exchange Rate Details</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased min-h-screen flex flex-col justify-center py-12 sm:px-6 lg:px-8">
<div class="sm:mx-auto sm:w-full sm:max-w-md">
    <div class="bg-slate-900 shadow-xl border border-slate-800 rounded-2xl overflow-hidden">
        <div class="bg-gradient-to-r from-slate-900 to-indigo-950 px-6 py-6 border-b border-slate-800">
            <h3 class="text-xl font-bold tracking-tight text-white flex items-center gap-2">Exchange Rate Metrics 🔍</h3>
            <p class="mt-1 text-xs text-slate-400">Detailed financial metric distribution matrix</p>
        </div>
        <div class="px-6 py-6 space-y-4">
            <div class="flex justify-between items-center py-2 border-b border-slate-800/60">
                <span class="text-xs font-semibold uppercase tracking-wider text-slate-500 flex items-center gap-1">🔑 Record ID</span>
                <span class="text-sm font-bold text-white font-mono" th:text="${rate.id}"></span>
            </div>
            <div class="flex justify-between items-center py-2 border-b border-slate-800/60">
                <span class="text-xs font-semibold uppercase tracking-wider text-slate-500 flex items-center gap-1">🎯 Target Asset</span>
                <span class="inline-flex items-center px-2.5 py-1 rounded-md text-xs font-bold bg-cyan-500/10 text-cyan-400 border border-cyan-500/20 font-mono uppercase" th:text="${rate.currency.code}"></span>
            </div>
            <div class="flex justify-between items-center py-2 border-b border-slate-800/60">
                <span class="text-xs font-semibold uppercase tracking-wider text-slate-500 flex items-center gap-1">📅 Active Date</span>
                <span class="text-sm font-semibold text-slate-300 font-mono" th:text="${rate.date}"></span>
            </div>
            <div class="flex justify-between items-center py-2 border-b border-slate-800/60">
                <span class="text-xs font-semibold uppercase tracking-wider text-slate-500 flex items-center gap-1">🟢 Purchase Margin</span>
                <span class="text-base font-bold text-emerald-400 font-mono" th:text="${rate.buyRate}"></span>
            </div>
            <div class="flex justify-between items-center py-2">
                <span class="text-xs font-semibold uppercase tracking-wider text-slate-500 flex items-center gap-1">🔴 Liquidation Margin</span>
                <span class="text-base font-bold text-rose-400 font-mono" th:text="${rate.sellRate}"></span>
            </div>
        </div>
        <div class="bg-slate-950/40 px-6 py-4 flex justify-between items-center border-t border-slate-800">
            <a th:href="@{/rates}" class="text-xs font-semibold text-slate-400 hover:text-slate-200 transition duration-150 flex items-center gap-1">⬅️ Back to list</a>
            <a th:href="@{/rates/edit/{id}(id=${rate.id})}" class="inline-flex items-center px-3 py-1.5 bg-indigo-600 text-white text-xs font-bold rounded-lg hover:bg-indigo-500 transition duration-150 shadow-md flex items-center gap-1">🛠️ Edit Metrics</a>
        </div>
    </div>
</div>
</body>
</html>
