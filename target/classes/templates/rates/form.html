<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${exchangeRateDto.id == null} ? 'Add Exchange Rate' : 'Edit Exchange Rate'">Rate Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-success text-white">
                    <h3 class="mb-0" th:text="${exchangeRateDto.id == null} ? 'Add New Exchange Rate' : 'Edit Exchange Rate'">Rate Form</h3>
                </div>
                <div class="card-body">
                    <form th:action="@{/rates/save}" th:object="${exchangeRateDto}" method="post">
                        <input type="hidden" th:field="*{id}" />

                        <div class="mb-3">
                            <label for="currencyId" class="form-label fw-bold">Currency:</label>
                            <select id="currencyId" th:field="*{currencyId}" class="form-select" th:classappend="${#fields.hasErrors('currencyId')} ? 'is-invalid' : ''">
                                <option value="">Select currency</option>
                                <option th:each="c : ${currencies}" th:value="${c.id}" th:text="${c.code}"></option>
                            </select>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('currencyId')}" th:errors="*{currencyId}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="date" class="form-label fw-bold">Date:</label>
                            <input type="date" id="date" th:field="*{date}" class="form-control" th:classappend="${#fields.hasErrors('date')} ? 'is-invalid' : ''" />
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('date')}" th:errors="*{date}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="buyRate" class="form-label fw-bold">Buy Rate:</label>
                            <input type="number" step="0.0001" id="buyRate" th:field="*{buyRate}" class="form-control" th:classappend="${#fields.hasErrors('buyRate')} ? 'is-invalid' : ''" />
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('buyRate')}" th:errors="*{buyRate}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="sellRate" class="form-label fw-bold">Sell Rate:</label>
                            <input type="number" step="0.0001" id="sellRate" th:field="*{sellRate}" class="form-control" th:classappend="${#fields.hasErrors('sellRate')} ? 'is-invalid' : ''" />
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('sellRate')}" th:errors="*{sellRate}"></div>
                        </div>

                        <div class="d-flex justify-content-end gap-2 mt-4">
                            <a th:href="@{/rates}" class="btn btn-secondary">Cancel</a>
                            <button type="submit" class="btn btn-success">Save Rate</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
