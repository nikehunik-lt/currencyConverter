<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${exchangeRateDto.id == null} ? 'Add Exchange Rate' : 'Edit Exchange Rate'">Rate Form</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased min-h-screen flex flex-col justify-center py-12 sm:px-6 lg:px-8">
<div class="sm:mx-auto sm:w-full sm:max-w-md">
    <h2 th:text="${exchangeRateDto.id == null} ? 'Add Exchange Rate ✨' : 'Edit Exchange Rate 🛠️'" class="text-center text-3xl font-bold tracking-tight text-white"></h2>
    <p class="mt-2 text-center text-sm text-slate-400">Configure financial distribution matrix parameters 📊</p>
</div>

<div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
    <div class="bg-slate-900 py-8 px-4 shadow-xl border border-slate-800 rounded-2xl sm:px-10">
        <form th:action="@{/rates/save}" th:object="${exchangeRateDto}" method="post" class="space-y-5">
            <input type="hidden" th:field="*{id}" />

            <div>
                <label for="currencyId" class="block text-sm font-semibold text-slate-300 flex items-center gap-1">🎯 Currency Target</label>
                <div class="mt-1">
                    <select id="currencyId" th:field="*{currencyId}" class="w-full px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-sm text-slate-200 focus:outline-none focus:ring-2 focus:ring-cyan-500/30 focus:border-cyan-400 transition duration-150" th:classappend="${#fields.hasErrors('currencyId')} ? 'border-rose-500 focus:ring-rose-500/30 focus:border-rose-500' : ''">
                        <option value="">Select currency</option>
                        <option th:each="c : ${currencies}" th:value="${c.id}" th:text="${c.code}"></option>
                    </select>
                </div>
                <p class="mt-1.5 text-xs text-rose-400 flex items-center gap-1" th:if="${#fields.hasErrors('currencyId')}">⚠️ <span th:errors="*{currencyId}"></span></p>
            </div>

            <div>
                <label for="date" class="block text-sm font-semibold text-slate-300 flex items-center gap-1">📅 Effective Date</label>
                <div class="mt-1">
                    <input type="date" id="date" th:field="*{date}" class="w-full px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-sm text-slate-200 focus:outline-none focus:ring-2 focus:ring-cyan-500/30 focus:border-cyan-400 transition duration-150 font-mono" th:classappend="${#fields.hasErrors('date')} ? 'border-rose-500 focus:ring-rose-500/30 focus:border-rose-500' : ''" />
                </div>
                <p class="mt-1.5 text-xs text-rose-400 flex items-center gap-1" th:if="${#fields.hasErrors('date')}">⚠️ <span th:errors="*{date}"></span></p>
            </div>

            <div>
                <label for="buyRate" class="block text-sm font-semibold text-slate-300 flex items-center gap-1">🟢 Buy Pricing Rate</label>
                <div class="mt-1">
                    <input type="number" step="0.0001" id="buyRate" th:field="*{buyRate}" class="w-full px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-sm text-slate-200 focus:outline-none focus:ring-2 focus:ring-cyan-500/30 focus:border-cyan-400 transition duration-150 font-mono" th:classappend="${#fields.hasErrors('buyRate')} ? 'border-rose-500 focus:ring-rose-500/30 focus:border-rose-500' : ''" />
                </div>
                <p class="mt-1.5 text-xs text-rose-400 flex items-center gap-1" th:if="${#fields.hasErrors('buyRate')}">⚠️ <span th:errors="*{buyRate}"></span></p>
            </div>

            <div>
                <label for="sellRate" class="block text-sm font-semibold text-slate-300 flex items-center gap-1">🔴 Sell Pricing Rate</label>
                <div class="mt-1">
                    <input type="number" step="0.0001" id="sellRate" th:field="*{sellRate}" class="w-full px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-sm text-slate-200 focus:outline-none focus:ring-2 focus:ring-cyan-500/30 focus:border-cyan-400 transition duration-150 font-mono" th:classappend="${#fields.hasErrors('sellRate')} ? 'border-rose-400 focus:ring-rose-500/30 focus:border-rose-500' : ''" />
                </div>
                <p class="mt-1.5 text-xs text-rose-400 flex items-center gap-1" th:if="${#fields.hasErrors('sellRate')}">⚠️ <span th:errors="*{sellRate}"></span></p>
            </div>

            <div class="flex items-center justify-end space-x-3 pt-4 border-t border-slate-800">
                <a th:href="@{/rates}" class="px-4 py-2 bg-slate-800 border border-slate-700 text-slate-300 font-medium text-sm rounded-xl hover:bg-slate-700 transition duration-150 flex items-center gap-1">🚫 Cancel</a>
                <button type="submit" class="px-4 py-2 bg-cyan-400 text-slate-950 font-bold text-sm rounded-xl hover:bg-cyan-300 transition duration-150 shadow-md shadow-cyan-500/10 flex items-center gap-1">💾 Save Rate</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
