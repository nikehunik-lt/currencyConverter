<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${exchangeRateDto.id == null} ? 'Add Exchange Rate' : 'Edit Exchange Rate'">Rate Form</title>
    <style>
        .error { color: red; font-size: 0.9em; display: block; }
        .form-group { margin-bottom: 15px; }
    </style>
</head>
<body>
<h1 th:text="${exchangeRateDto.id == null} ? 'Add New Exchange Rate' : 'Edit Exchange Rate'">Rate Form</h1>

<form th:action="@{/rates/save}" th:object="${exchangeRateDto}" method="post">
    <input type="hidden" th:field="*{id}" />

    <div class="form-group">
        <label for="currencyId">Currency:</label>
        <select id="currencyId" th:field="*{currencyId}">
            <option value="">Select currency</option>
            <option th:each="c : ${currencies}" th:value="${c.id}" th:text="${c.code}"></option>
        </select>
        <span class="error" th:if="${#fields.hasErrors('currencyId')}" th:errors="*{currencyId}"></span>
    </div>

    <div class="form-group">
        <label for="date">Date:</label>
        <input type="date" id="date" th:field="*{date}" />
        <span class="error" th:if="${#fields.hasErrors('date')}" th:errors="*{date}"></span>
    </div>

    <div class="form-group">
        <label for="buyRate">Buy Rate:</label>
        <input type="number" step="0.0001" id="buyRate" th:field="*{buyRate}" />
        <span class="error" th:if="${#fields.hasErrors('buyRate')}" th:errors="*{buyRate}"></span>
    </div>

    <div class="form-group">
        <label for="sellRate">Sell Rate:</label>
        <input type="number" step="0.0001" id="sellRate" th:field="*{sellRate}" />
        <span class="error" th:if="${#fields.hasErrors('sellRate')}" th:errors="*{sellRate}"></span>
    </div>

    <button type="submit">Save</button>
    <a th:href="@{/rates}">Cancel</a>
</form>
</body>
</html>
