<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Currencies</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="text-primary">Currencies List</h1>
        <div>
            <a th:href="@{/currencies/add}" class="btn btn-success">Add New Currency</a>
            <a th:href="@{/rates}" class="btn btn-outline-secondary">Exchange Rates</a>
        </div>
    </div>

    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <form th:action="@{/currencies}" method="get" class="d-flex">
                <input type="text" name="search" class="form-control me-2" placeholder="Search by code or name" th:value="${search}"/>
                <button type="submit" class="btn btn-primary me-2">Search</button>
                <a th:href="@{/currencies}" class="btn btn-secondary">Clear</a>
            </form>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover table-striped mb-0">
                    <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Code</th>
                        <th>Name</th>
                        <th class="text-end">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="currency : ${currencies}">
                        <td><a th:href="@{/currencies/{id}(id=${currency.id})}" class="fw-bold" th:text="${currency.id}"></a></td>
                        <td th:text="${currency.code}"></td>
                        <td th:text="${currency.name}"></td>
                        <td class="text-end">
                            <a th:href="@{/currencies/edit/{id}(id=${currency.id})}" class="btn btn-sm btn-warning">Edit</a>
                            <form th:action="@{/currencies/delete/{id}(id=${currency.id})}" method="post" class="d-inline">
                                <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
