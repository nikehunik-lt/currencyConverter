<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Currencies Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased">
<div class="min-h-screen flex flex-col">
    <nav class="bg-slate-900/80 backdrop-blur-md border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center space-x-8">
                    <span class="text-xl font-bold bg-gradient-to-r from-cyan-400 to-indigo-400 bg-clip-text text-transparent flex items-center gap-2">📊 FX Analytics</span>
                    <div class="hidden md:flex space-x-6">
                        <a th:href="@{/currencies}" class="border-b-2 border-cyan-400 px-1 pt-1 text-sm font-semibold text-slate-100 flex items-center gap-1.5">💵 Currencies</a>
                        <a th:href="@{/rates}" class="border-b-2 border-transparent px-1 pt-1 text-sm font-medium text-slate-400 hover:text-slate-200 hover:border-slate-700 flex items-center gap-1.5">📈 Exchange Rates</a>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    <span class="text-xs font-mono bg-slate-800 px-2.5 py-1 rounded-md text-slate-400 flex items-center gap-1">👤 <span sec:authentication="name">Username</span></span>
                    <form th:action="@{/logout}" method="post" class="inline">
                        <button type="submit" class="px-3 py-1.5 text-xs font-semibold rounded-lg text-rose-400 bg-rose-500/10 border border-rose-500/20 hover:bg-rose-500/20 transition duration-150 flex items-center gap-1">🚪 Log Out</button>
                    </form>
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="sm:flex sm:items-center sm:justify-between mb-8">
            <div>
                <h1 class="text-3xl font-bold text-white tracking-tight flex items-center gap-2">Currencies 🪙</h1>
                <p class="mt-2 text-sm text-slate-400">Manage global currencies and tracking codes 🌍</p>
            </div>
            <div class="mt-4 sm:mt-0">
                <a th:href="@{/currencies/add}" class="inline-flex items-center justify-center px-4 py-2.5 border border-transparent text-sm font-semibold rounded-xl text-slate-950 bg-cyan-400 hover:bg-cyan-300 shadow-lg shadow-cyan-500/20 transition duration-150 gap-1.5">
                    ✨ Add New Currency
                </a>
            </div>
        </div>

        <div class="bg-slate-900 rounded-2xl border border-slate-800 shadow-xl p-6 mb-8">
            <form th:action="@{/currencies}" method="get" class="sm:flex sm:items-center space-y-3 sm:space-y-0 sm:space-x-4">
                <div class="relative flex-1">
                    <input type="text" name="search" th:value="${search}" placeholder="Search by currency code or name... 🔍" class="w-full pl-4 pr-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-cyan-500/30 focus:border-cyan-400 transition duration-150" />
                </div>
                <div class="flex space-x-3">
                    <button type="submit" class="px-5 py-2.5 bg-indigo-600 text-white font-semibold text-sm rounded-xl hover:bg-indigo-500 transition duration-150 shadow-md flex items-center gap-1.5">⚡ Search</button>
                    <a th:href="@{/currencies}" class="px-5 py-2.5 bg-slate-800 border border-slate-700 text-slate-300 font-medium text-sm rounded-xl hover:bg-slate-700 transition duration-150 flex items-center gap-1.5">🧹 Clear</a>
                </div>
            </form>
        </div>

        <div class="bg-slate-900 rounded-2xl border border-slate-800 shadow-xl overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                    <tr class="bg-slate-950/60 border-b border-slate-800 text-xs font-semibold text-slate-400 uppercase tracking-wider">
                        <th class="px-6 py-4">ID</th>
                        <th class="px-6 py-4">Code</th>
                        <th class="px-6 py-4">Name</th>
                        <th class="px-6 py-4 text-right">Actions</th>
                    </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-800/60 text-sm">
                    <tr th:each="currency : ${currencies}" class="hover:bg-slate-800/40 transition duration-150">
                        <td class="px-6 py-4 whitespace-nowrap">
                            <a th:href="@{/currencies/{id}(id=${currency.id})}" th:text="${currency.id}" class="font-bold text-cyan-400 hover:text-cyan-300"></a>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <span class="inline-flex items-center px-2.5 py-1 rounded-md text-xs font-bold bg-cyan-500/10 text-cyan-400 border border-cyan-500/20 font-mono uppercase" th:text="${currency.code}"></span>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-slate-300 font-medium" th:text="${currency.name}"></td>
                        <td class="px-6 py-4 whitespace-nowrap text-right space-x-2">
                            <a th:href="@{/currencies/edit/{id}(id=${currency.id})}" class="inline-flex items-center px-3 py-1.5 border border-slate-700 text-xs font-semibold rounded-lg text-slate-300 bg-slate-800 hover:bg-slate-700 transition duration-150 gap-1">🛠️ Edit</a>
                            <form th:action="@{/currencies/delete/{id}(id=${currency.id})}" method="post" class="inline">
                                <button type="submit" class="inline-flex items-center px-3 py-1.5 text-xs font-semibold rounded-lg text-rose-400 bg-rose-500/10 border border-rose-500/20 hover:bg-rose-500/20 transition duration-150 gap-1">🗑️ Delete</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>
</body>
</html>
