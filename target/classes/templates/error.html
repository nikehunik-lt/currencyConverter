<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>System Error</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased min-h-screen flex flex-col justify-center py-12 sm:px-6 lg:px-8">
<div class="sm:mx-auto sm:w-full sm:max-w-md">
    <div class="bg-slate-900 shadow-2xl border border-rose-950 rounded-2xl overflow-hidden">
        <div class="bg-rose-950/20 border-b border-rose-900/40 px-6 py-6 flex items-center space-x-4">
            <div class="p-2 bg-rose-500/10 border border-rose-500/20 rounded-xl text-rose-400 text-xl">
                🚨
            </div>
            <div>
                <h3 class="text-lg font-bold text-white tracking-tight">System Exception</h3>
                <p class="text-xs text-rose-400">An error disrupted the standard lifecycle flow 🛠️</p>
            </div>
        </div>
        <div class="px-6 py-6">
            <p class="text-sm text-slate-300 font-medium bg-slate-950 border border-slate-800 rounded-xl p-4 font-mono break-words" th:text="${errorMessage}">Something went wrong.</p>
        </div>
        <div class="bg-slate-950/40 px-6 py-4 flex justify-end border-t border-slate-800">
            <a th:href="@{/currencies}" class="inline-flex items-center px-4 py-2 bg-indigo-600 text-white text-sm font-semibold rounded-xl hover:bg-indigo-500 transition duration-150 shadow-md gap-1">🏠 Return Home</a>
        </div>
    </div>
</div>
</body>
</html>
